<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="薬剤師向けOTCトリアージ支援ツール。症状別のレッドフラッグ確認から、受診勧奨・OTC対応（成分群）までを段階的に判断補助します。">

<style>

*{box-sizing:border-box}
body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans);

a{color:var(--green)}
:focus-visible{outline:2px solid var(--green); outline-offset:2px}
header{position:sticky; top:0; background:color-mix(in srgb, var(--paper) 88%, transparent);
  -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); z-index:10}
.hwrap{max-width:760px; margin:0 auto; padding:10px 20px; display:flex; align-items:center; gap:9px}
.hwrap svg{width:20px; height:20px; fill:var(--green)}
.hwrap a{font-family:var(--serif); font-size:1.1rem; font-weight:600; letter-spacing:.12em;

.hsub{font-size:.7rem; color:var(--muted); margin-left:auto; letter-spacing:.06em}
main{max-width:760px; margin:0 auto; padding:22px 20px 70px}

.beta{background:var(--amber-soft); border:1px solid color-mix(in srgb, var(--amber) 40%, transparent);

.disc{background:var(--blue-soft); border-radius:12px; padding:10px 14px; font-size:.76rem; color:var(--ink); margin-bottom:22px}

h1{font-family:var(--serif); font-weight:600; font-size:clamp(1.35rem,4.2vw,1.7rem); letter-spacing:.05em; margin:4px 0 8px}
.lead{color:var(--muted); font-size:.88rem; margin:0 0 18px}

.qsub{font-size:.8rem; color:var(--muted); margin:0 0 14px}

.modgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px}
.modbtn{font-family:var(--sans); text-align:left; cursor:pointer; background:var(--card);

.modbtn b{display:block; font-size:.96rem}
.modbtn span{font-size:.7rem; color:var(--muted)}

.ck{display:flex; gap:11px; align-items:flex-start; background:var(--card); border:1px solid var(--line);

.ck input{width:20px; height:20px; margin:3px 0 0; accent-color:var(--red); flex:none}
.ck.dr input{accent-color:var(--amber)}
.ck:has(input:checked){border-color:var(--red); background:var(--red-soft)}
.ck.dr:has(input:checked){border-color:var(--amber); background:var(--amber-soft)}

.typebtn{font-family:var(--sans); text-align:left; cursor:pointer; background:var(--card);
  border:1px solid var(--line); border-radius:12px; padding:13px 15px; font-size:.9rem; color:var(--ink)}
.typebtn:hover{border-color:var(--green); color:var(--green)}

.btnrow{display:flex; gap:9px; flex-wrap:wrap}
.btn{font-family:var(--sans); cursor:pointer; border-radius:11px; padding:12px 18px; font-size:.9rem;
  border:1px solid var(--line-strong); background:var(--card); color:var(--ink); min-height:46px}
.btn.primary{background:var(--green); border-color:var(--green); color:#fff}
.btn.primary:hover{opacity:.92}
.btn.ghost{background:transparent}

.verdict{border-radius:15px; padding:17px 19px; margin-bottom:16px; border:1.5px solid}
.v-er{background:var(--red-soft); border-color:var(--red)}
.v-dr{background:var(--amber-soft); border-color:var(--amber)}
.v-ok{background:var(--green-soft); border-color:var(--green)}
.verdict .vt{font-family:var(--serif); font-weight:700; font-size:1.15rem; letter-spacing:.05em; margin:0 0 4px}
.v-er .vt{color:var(--red)} .v-dr .vt{color:var(--amber)} .v-ok .vt{color:var(--green)}
.verdict p{margin:4px 0; font-size:.88rem}
.hitlist{margin:8px 0 0; padding-left:20px; font-size:.85rem}
.hitlist li{margin:3px 0}

.reccard{background:var(--card); border:1px solid var(--line); border-radius:13px; padding:15px 17px; margin-bottom:12px}
.reccard h3{margin:0 0 8px; font-size:.95rem; font-family:var(--serif); letter-spacing:.04em;

.gline{margin:9px 0; font-size:.87rem}
.gline b{display:block}
.gline span{font-size:.78rem; color:var(--muted)}
.notes{margin:8px 0 0; padding-left:20px; font-size:.8rem; color:var(--muted)}
.notes li{margin:3px 0}
.confirm{background:var(--blue-soft); border-radius:12px; padding:13px 16px; font-size:.8rem; margin-bottom:12px}
.confirm b{display:block; margin-bottom:5px; font-size:.84rem}
.confirm ul{margin:0; padding-left:19px}
.confirm li{margin:3px 0}

footer{border-top:1px solid var(--line)}
.fwrap{max-width:760px; margin:0 auto; padding:20px; font-size:.74rem; color:var(--muted)}
.fwrap a{color:var(--muted)}

</head>

/* ============================================================
   エンジン部（通常は編集不要）
   ============================================================ */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app = document.getElementById('app');
let state = { mod:null, step:0, erHits:[], drHits:[] };

if (REVIEWED) document.getElementById('beta-banner').style.display = 'none';

function findMod(id){ return MODULES.find(m => m.id === id); }

function viewHome(){
  state = { mod:null, step:0, erHits:[], drHits:[] };
  app.innerHTML =
    '<h1>OTCトリアージ支援</h1>' +
    '<p class="lead">相談された症状を選んでください。緊急サイン → 受診の目安 → 症状タイプの順に確認し、対応の候補を表示します。</p>' +
    '<div class="modgrid">' +
    MODULES.map(m => '<button class="modbtn" data-mod="' + m.id + '"><b>' + esc(m.name) + '</b><span>' + esc(m.desc) + '</span></button>').join('') +
    '</div>';
}

function viewCheck(kind){  // kind: 'er' | 'dr'
  const m = state.mod;
  const list = kind === 'er' ? m.er : m.dr;
  const title = kind === 'er' ? '緊急サインの確認' : '受診をすすめる目安の確認';
  const sub = kind === 'er'
    ? '1つでも該当すれば、販売より受診・救急の案内を優先します。'
    : '1つでも該当すれば、受診をすすめることを基本にします。';
  const stepNo = kind === 'er' ? 'STEP 1 / 3' : 'STEP 2 / 3';
  app.innerHTML =
    '<p class="stepmark">' + esc(m.name) + ' ── ' + stepNo + '</p>' +
    '<h2 class="q">' + title + '</h2><p class="qsub">' + sub + '</p>' +
    '<div class="cklist">' +
    list.map((t,i) => '<label class="ck' + (kind==='dr'?' dr':'') + '"><input type="checkbox" data-i="' + i + '"><span>' + esc(t) + '</span></label>').join('') +
    '</div>' +
    '<div class="btnrow">' +
    '<button class="btn primary" id="go-next">確認して次へ</button>' +
    '<button class="btn ghost" id="go-home">症状選択に戻る</button>' +
    '</div>';
  document.getElementById('go-next').addEventListener('click', () => {
    const hits = [...app.querySelectorAll('input:checked')].map(c => list[Number(c.dataset.i)]);
    if (kind === 'er'){
      if (hits.length){ state.erHits = hits; viewResult('er'); }
      else { state.step = 2; viewCheck('dr'); }
    } else {
      if (hits.length){ state.drHits = hits; viewResult('dr'); }
      else { state.step = 3; viewType(); }
    }
  });
}

function viewType(){
  const m = state.mod;
  if (m.types.length === 1){ viewResult('ok', m.types[0].k); return; }
  app.innerHTML =
    '<p class="stepmark">' + esc(m.name) + ' ── STEP 3 / 3</p>' +
    '<h2 class="q">症状のタイプ</h2><p class="qsub">最も近いものを選んでください。</p>' +
    '<div class="typegrid">' +
    m.types.map(t => '<button class="typebtn" data-k="' + t.k + '">' + esc(t.t) + '</button>').join('') +
    '</div>' +
    '<div class="btnrow"><button class="btn ghost" id="go-home">症状選択に戻る</button></div>';
}

function viewResult(kind, typeKey){
  const m = state.mod;
  let html = '<p class="stepmark">' + esc(m.name) + ' ── 判定</p>';
  if (kind === 'er'){
    html += '<div class="verdict v-er"><p class="vt">受診・救急の案内を優先</p>' +
      '<p>緊急性が疑われるサインに該当しています。<b>OTCの販売は行わず</b>、状態に応じて救急要請または救急外来・当日受診を案内してください。</p>' +
      '<ul class="hitlist">' + state.erHits.map(h => '<li>' + esc(h) + '</li>').join('') + '</ul></div>';
  } else if (kind === 'dr'){
    html += '<div class="verdict v-dr"><p class="vt">受診勧奨</p>' +
      '<p>受診をすすめる目安に該当しています。<b>本日〜数日中の受診を基本に案内</b>してください。つなぎの対症対応が必要な場合も、受診を前提に短期にとどめます。</p>' +
      '<ul class="hitlist">' + state.drHits.map(h => '<li>' + esc(h) + '</li>').join('') + '</ul></div>';
  } else {
    const r = m.rec[typeKey];
    html += '<div class="verdict v-ok"><p class="vt">OTC対応可（受診目安つき）</p>' +
      '<p>緊急サイン・受診目安への該当はありません。以下の成分群が対応の候補です。<b>添付文書の「してはいけないこと」「相談すること」を必ず確認</b>のうえ選択してください。</p></div>' +
      '<div class="reccard"><h3>' + esc(r.h) + '</h3>' +
      r.g.map(g => '<div class="gline"><b>' + esc(g[0]) + '</b><span>' + esc(g[1]) + '</span></div>').join('') +
      (r.n && r.n.length ? '<ul class="notes">' + r.n.map(n => '<li>' + esc(n) + '</li>').join('') + '</ul>' : '') +
      '</div>' +
      '<div class="confirm"><b>販売前の共通確認</b><ul>' + COMMON.map(c => '<li>' + esc(c) + '</li>').join('') + '</ul></div>';
  }
  html += '<div class="btnrow">' +
    '<button class="btn primary" id="go-home">別の症状を確認する</button>' +
    '<button class="btn ghost" id="go-retry">この症状をやり直す</button>' +
    '</div>';
  app.innerHTML = html;
}

app.addEventListener('click', e => {
  const mb = e.target.closest('.modbtn');
  if (mb){ state.mod = findMod(mb.dataset.mod); state.step = 1; state.erHits = []; state.drHits = []; viewCheck('er'); return; }
  const tb = e.target.closest('.typebtn');
  if (tb){ viewResult('ok', tb.dataset.k); return; }
  if (e.target.id === 'go-home'){ viewHome(); window.scrollTo(0,0); return; }
  if (e.target.id === 'go-retry'){ const m = state.mod; state.erHits=[]; state.drHits=[]; viewCheck('er'); window.scrollTo(0,0); return; }
});

viewHome();
</script>
